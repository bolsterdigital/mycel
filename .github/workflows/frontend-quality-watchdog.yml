name: Frontend quality watchdog

# Independent of the measured workflow: a disabled/missed weekly run cannot monitor itself.
# Read-only observation, no issue/status/planning writes or production credentials.
on:
  pull_request:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Read workflow history and sanitized artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/history.mjs --out=.scratch/quality-history
      - name: Consume retained evidence with explicit clock
        if: always()
        run: node scripts/quality/consume.mjs --input=.scratch/quality-history --as-of="$(date -u +%FT%TZ)" --out=.scratch/quality-consumed
      - name: Summarize factory evidence from the same history
        if: always()
        run: node scripts/quality/factory.mjs --input=.scratch/quality-consumed/summary.json --out=.scratch/quality-factory
      - name: Publish observed state
        if: always()
        run: |
          cat .scratch/quality-consumed/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat .scratch/quality-factory/factory.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-watchdog-summary
          path: |
            .scratch/quality-consumed/summary.*
            .scratch/quality-factory/factory.*
          retention-days: 90
          if-no-files-found: error
