name: Restore drill

# Restoring is a rehearsed procedure, not a promise (TODO #18c, docs/self-hosting.md § Restore):
# scripts/drill-run.sh backs up a populated compose.yml stack with the backup image, restores it
# onto an empty one as the non-superuser owner, migrates, and proves the data, the media files,
# tenant isolation and the worker came back; the measured RTO goes into the job summary. Monthly on
# an empty runner, so a drift in Postgres, restic or the images shows up without anyone touching
# the backup, and on every pull request that does touch it. Its own workflow, not a job in
# verify.yml: it takes several minutes and has nothing to say about most pull requests.

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/backup/**'
      - 'docker/postgres/**'
      - 'compose.yml'
      - 'compose.drill.yml'
      - 'scripts/drill-*'
      - '.github/workflows/restore-drill.yml'
      # What the drill restores and erases with (TODO #29B): the register, the export's table
      # list, the schema and the CLI that applies and reports erasures.
      - 'packages/db/src/erasures.ts'
      - 'packages/db/src/export.ts'
      # The export job and its archives, which a backup leaves out (TODO #28).
      - 'packages/db/src/tenant-exports.ts'
      - 'packages/db/migrations/**'
      - 'packages/api/src/cli.ts'

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The fixture, the fingerprint and the conformance suites run from the host against the
      # compose stack; they need the compiled packages, not the web build.
      - run: npm ci
      - run: npx tsc -b packages/api

      - name: Build image (no push)
        run: docker build -t mycel:ci .

      - name: Restore drill
        run: scripts/drill-run.sh
