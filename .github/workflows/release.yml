name: Release

# A tag `vX.Y.Z` on main publishes the image every self-hoster pins (TODO #18b, docs/upgrading.md):
# multi-arch (amd64, arm64) at ghcr.io/bolsterdigital/mycel with the tags X.Y.Z, X.Y, X and
# latest (a prerelease such as 0.2.0-rc.1 gets only its own tag), OCI labels, a build provenance
# attestation and a GitHub Release whose text is the version's CHANGELOG.md section. The tag
# comes from `npm run release` (scripts/release.mjs), which also sets the version this job
# checks. Every action is pinned to a commit with its version as a comment, because a moved tag
# of a third-party action would otherwise run with these permissions.
# Rejected: publishing on every push to main, which gives self-hosters no version to pin.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bolsterdigital/mycel

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Tag is a commit on main and matches package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not a commit on main"; exit 1
          fi
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME, package.json $pkg: cut releases with npm run release"; exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver patterns give X.Y.Z, X.Y and X; for a prerelease the action emits only the full
      # version. `latest` is explicit so a prerelease never moves it.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Mycel
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MYCEL_VERSION=${{ steps.version.outputs.version }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: The published image reports its version
        run: |
          docker run --rm "$IMAGE:${{ steps.version.outputs.version }}" mycel version \
            | grep -qx "${{ steps.version.outputs.version }}"

      - name: GitHub Release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          [ "${{ steps.version.outputs.prerelease }}" = true ] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $flag
