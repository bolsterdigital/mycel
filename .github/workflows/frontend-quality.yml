name: Frontend quality

# Separate observation job: Lighthouse is development-only and never extends verify's budget.
# Every executable PR gets the default set; weekly/manual runs expand locale/cache/admin scope.
# Pinning Node, Lighthouse, Playwright's Chromium and Caddy prevents silent tool upgrades.
# `merge_group` measures the queue commit with the PR set, so the required checks report there.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/quality/matrix.mjs >> "$GITHUB_OUTPUT"
      - name: Reuse one production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-build
          path: |
            apps/web/build
            packages/*/dist
          retention-days: 1
          if-no-files-found: error

  measure:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mycel
          POSTGRES_USER: mycel
          POSTGRES_PASSWORD: mycel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mycel -d mycel" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      # One immutable browser userspace, independent of rolling GitHub host images.
      QUALITY_RUNNER_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:d65108d1a8095d8b0c4a5e32bf1807a40a5ce90ff0c78473e1116b1c243235e8
      DATABASE_URL: postgres://mycel:mycel@localhost:5432/mycel
      APP_DATABASE_URL: postgres://mycel_app:mycel_app_ci@localhost:5432/mycel
      MYCEL_APP_PASSWORD: mycel_app_ci
      AUTH_DATABASE_URL: postgres://mycel_authenticator:mycel_auth_ci@localhost:5432/mycel
      MYCEL_AUTH_PASSWORD: mycel_auth_ci
      SIGNING_SECRET: ci-only-signing-secret
      AUDIT_HASH_KEY: ci-only-audit-hash-key
      CONNECTION_CREDENTIAL_KEY: '1010101010101010101010101010101010101010101010101010101010101010'
      PUBLIC_BASE_URL: https://localhost:4443
      PLATFORM_DOMAIN: localhost
      MAIL_FROM: CI <noreply@example.org>
      MAILER: console
      E2E_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-build
          path: .
      - name: Install pinned browser and proxy
        timeout-minutes: 3
        run: |
          docker pull "$QUALITY_RUNNER_IMAGE"
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 2 -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          echo '5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  /tmp/caddy.tar.gz' | sha256sum --check
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy
          sudo install /tmp/caddy /usr/local/bin/caddy
      - name: Retrieve previous sanitized main summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/baseline.mjs quality-baseline-${{ matrix.scope }}-${{ matrix.locale }}-${{ matrix.profile }}-${{ matrix.cache }}
      - name: Five samples per cell (calibration, actual state stays in reports)
        id: measurement
        timeout-minutes: 6
        continue-on-error: true
        run: |
          docker run --rm --init --network host --shm-size=1g \
            --user "$(id -u):$(id -g)" --workdir "$PWD" \
            --volume "$PWD:$PWD" \
            --volume "$(dirname "$(dirname "$(command -v node)")"):/opt/quality-node:ro" \
            --volume /usr/local/bin/caddy:/usr/local/bin/caddy:ro \
            --env PATH=/opt/quality-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/tmp --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory --env "GIT_CONFIG_VALUE_0=$PWD" \
            --env DATABASE_URL --env APP_DATABASE_URL --env MYCEL_APP_PASSWORD \
            --env AUTH_DATABASE_URL --env MYCEL_AUTH_PASSWORD --env SIGNING_SECRET \
            --env AUDIT_HASH_KEY --env CONNECTION_CREDENTIAL_KEY --env PUBLIC_BASE_URL \
            --env PLATFORM_DOMAIN --env MAIL_FROM --env MAILER --env E2E_REQUIRED \
            --env GITHUB_ACTIONS --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env QUALITY_RUNNER_IMAGE --env "QUALITY_HOST_IMAGE=$ImageVersion" \
            "$QUALITY_RUNNER_IMAGE" \
            npm run quality -- --scope=${{ matrix.scope }} --locale=${{ matrix.locale }} --profile=${{ matrix.profile }} --cache=${{ matrix.cache }} --out=.scratch/quality-report --baseline=.scratch/quality-baseline/summary.json
      # Preserve private originals encrypted to the operator's public certificate. Run again
      # after timeout/interruption too; the private key never enters GitHub or the repository.
      - name: Encrypt authenticated reports even after failure
        if: always()
        run: node scripts/quality/protect.mjs .scratch/quality-report
      - name: Preserve encrypted authenticated reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-private-${{ matrix.scope }}-${{ matrix.locale }}-${{ matrix.profile }}-${{ matrix.cache }}
          path: .scratch/quality-report/private.tar.gz.cms
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve public raw reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-raw-${{ matrix.scope }}-${{ matrix.locale }}-${{ matrix.profile }}-${{ matrix.cache }}
          path: .scratch/quality-report/public
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve sanitized summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-summary-${{ matrix.scope }}-${{ matrix.locale }}-${{ matrix.profile }}-${{ matrix.cache }}
          path: .scratch/quality-report/summary.json
          retention-days: 90
          if-no-files-found: error
      # Failed observation runs never overwrite the latest successful baseline history.
      - name: Retain a successful baseline summary
        if: steps.measurement.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-baseline-${{ matrix.scope }}-${{ matrix.locale }}-${{ matrix.profile }}-${{ matrix.cache }}
          path: .scratch/quality-report/summary.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish measured state and enforce calibration deadline
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
        run: node scripts/quality/status.mjs .scratch/quality-report/summary.json >> "$GITHUB_STEP_SUMMARY"

  frontend-quality:
    name: frontend-quality
    if: always()
    needs: [prepare, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Retrieve every sanitized shard
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quality-summary-*
          path: .scratch/quality-shards
      - name: Validate expected matrix and enforce measured state
        if: always()
        env:
          QUALITY_NEEDS: ${{ toJSON(needs) }}
          QUALITY_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node scripts/quality/gate.mjs .scratch/quality-shards .scratch/quality-gate >> "$GITHUB_STEP_SUMMARY"
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-gate-${{ github.run_attempt }}
          path: .scratch/quality-gate
          retention-days: 90
          if-no-files-found: error
