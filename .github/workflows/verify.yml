name: Verify

# Gate on what silently rots: formatting, dependency direction and licences, types,
# tests and the build, plus the Playwright + axe gate against a real Postgres. Runs on
# PRs and pushes to main. Deployment is a separate workflow so a red check here never
# blocks an already-merged fix, but a red check on the PR is the signal to fix it first.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mycel
          POSTGRES_USER: mycel
          POSTGRES_PASSWORD: mycel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mycel -d mycel" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mycel:mycel@localhost:5432/mycel
      APP_DATABASE_URL: postgres://mycel_app:mycel_app_ci@localhost:5432/mycel
      MYCEL_APP_PASSWORD: mycel_app_ci
      SIGNING_SECRET: ci-only-signing-secret
      PUBLIC_BASE_URL: http://127.0.0.1:4173
      MAIL_FROM: CI <noreply@example.org>
      MAILER: console
      # In CI a missing database or browser fails the e2e gate instead of skipping it.
      E2E_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Signed-off-by on every commit (DCO)
        if: github.event_name == 'pull_request'
        run: |
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly)' \
            origin/${{ github.base_ref }}..HEAD | awk 'NF < 2 { print $1 }')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (use git commit -s):"; echo "$missing"; exit 1
          fi

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Before the tests: the db suite connects as mycel_app, whose login migrate enables.
      - name: Migrate
        run: npm run migrate -w @mycel/db

      - run: npm run verify

  # The deployable artefact (Dockerfile): build it without pushing, then start each entrypoint
  # and wait for its HEALTHCHECK. A separate job so an image problem shows up as its own red
  # check next to `verify`. Publishing to a registry is the deploy workflow's job, not this one.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t mycel:ci .

      - name: Each entrypoint becomes healthy
        run: |
          # Dummy configuration: /healthz touches no adapter and the pools connect lazily, so no
          # database is needed to prove the processes start. MAILER=console is refused in
          # production, hence the placeholder TEM settings.
          env_args="-e APP_DATABASE_URL=postgres://mycel_app:x@127.0.0.1:1/mycel
            -e DATABASE_URL=postgres://mycel:x@127.0.0.1:1/mycel
            -e SIGNING_SECRET=ci-only-signing-secret -e PUBLIC_BASE_URL=http://localhost:3000
            -e MAIL_FROM=noreply@example.org -e MAILER=tem -e TEM_SECRET_KEY=x -e TEM_PROJECT_ID=x"
          for role in api web worker; do
            docker run -d --name "mycel-$role" --health-interval 2s --health-start-period 2s \
              $env_args mycel:ci "$role"
          done
          for role in api web worker; do
            status=starting
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "mycel-$role")
              [ "$status" = healthy ] && break
              sleep 2
            done
            echo "$role: $status"
            if [ "$status" != healthy ]; then docker logs "mycel-$role"; exit 1; fi
          done
