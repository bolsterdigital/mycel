name: Verify

# Gate on what silently rots: formatting, dependency direction and licences, types,
# tests and the build in checks, plus isolated Playwright projects against Postgres.
# Rejected: one serial job, which exhausted its deadline before retaining failure evidence. The
# `security` job (advisories and secrets) needs the network, so it is not part of
# `npm run verify`, which needs a database but no network. Runs on PRs and pushes to main.
# Publishing is a separate workflow (release.yml, on a tag), so a red check here never blocks
# an already-merged fix, but a red check on the PR is the signal to fix it first.
# `merge_group` runs the same jobs on the merge queue's commit (the PR on the current main), so
# the required checks report there too; each queue ref is unique, so the concurrency group
# never cancels another group's run. Rejected: `strict` branch protection without a queue,
# which leaves every PR behind as soon as another one merges.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job; none of them writes to the repository or a registry.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: mycel
          POSTGRES_USER: mycel
          POSTGRES_PASSWORD: mycel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mycel -d mycel" --health-interval 2s --health-timeout 3s
          --health-retries 20
      # S3-compatible storage for the BlobStore contract suite (TODO #10); RustFS because MinIO
      # no longer publishes images (compose.dev.yml says the same). The suite creates its bucket.
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: mycel
          RUSTFS_SECRET_KEY: mycel-s3-ci
        ports: ['9000:9000']
    env:
      DATABASE_URL: postgres://mycel:mycel@localhost:5432/mycel
      APP_DATABASE_URL: postgres://mycel_app:mycel_app_ci@localhost:5432/mycel
      MYCEL_APP_PASSWORD: mycel_app_ci
      AUTH_DATABASE_URL: postgres://mycel_authenticator:mycel_auth_ci@localhost:5432/mycel
      MYCEL_AUTH_PASSWORD: mycel_auth_ci
      SIGNING_SECRET: ci-only-signing-secret
      AUDIT_HASH_KEY: ci-only-audit-hash-key
      CONNECTION_CREDENTIAL_KEY: '1010101010101010101010101010101010101010101010101010101010101010'
      PUBLIC_BASE_URL: http://127.0.0.1:4173
      PLATFORM_DOMAIN: localhost
      MAIL_FROM: CI <noreply@example.org>
      MAILER: console
      # Adapter fixtures use a deterministic model, never a network provider.
      ASSIST_PROVIDER: fake
      BLOB_S3_ENDPOINT: http://127.0.0.1:9000
      BLOB_S3_REGION: us-east-1
      BLOB_S3_BUCKET: mycel-ci
      BLOB_S3_ACCESS_KEY_ID: mycel
      BLOB_S3_SECRET_ACCESS_KEY: mycel-s3-ci
      BLOB_S3_FORCE_PATH_STYLE: '1'
      # In CI a missing database or browser fails the e2e gate instead of skipping it.
      E2E_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Both checks below need `github.base_ref` and run on the PR. In a merge queue they are
      # skipped (same step, same job result): the queue commit holds exactly the commits the PR
      # run already checked, plus main, which passed them on its own PRs.
      - name: Signed-off-by on every commit (DCO)
        if: github.event_name == 'pull_request'
        run: |
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly)' \
            origin/${{ github.base_ref }}..HEAD | awk 'NF < 2 { print $1 }')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (use git commit -s):"; echo "$missing"; exit 1
          fi

      # docs/upgrading.md promise 2: an applied migration is never edited. A pull request may
      # only add files under packages/db/migrations; `migrate` refuses a changed applied file at
      # start (checksums), this stops it before it is merged.
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" \
            -- packages/db/migrations | awk '$1 != "A"')
          if [ -n "$changed" ]; then
            echo "A merged migration was changed, renamed or deleted; add a new one instead:"
            echo "$changed"; exit 1
          fi

      # The nine font packages `--with-deps` adds came from the Ubuntu mirror in 16 s or in over nine
      # minutes, inside the step limit below, so a slow mirror failed the job with no test red. apt
      # checks a cached .deb against its signed index and fetches again on a mismatch, so this adds
      # no trust. The action reports a restore error or a download past its segment limit as a
      # warning, so both only mean the old download.
      # Rejected: a higher step limit (hides a hang), dropping the fonts (rendering may change).
      - name: Restore browser system packages
        id: browser-debs
        timeout-minutes: 2
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ~/browser-debs
          key: browser-debs-ubuntu-24.04-v1

      - name: Hand restored packages to apt
        run: |
          mkdir -p ~/browser-debs
          find ~/browser-debs -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +

      # One execution deadline includes install/migration, leaving time to retain evidence.
      - name: Static, adapter and unit checks
        timeout-minutes: 12
        run: |
          mkdir -p .scratch/ci
          exec > >(tee .scratch/ci/checks.log) 2>&1
          PS4='+ $(date -u +%FT%TZ) '
          set -x
          # Capture the status before timestamp expansion, including on Bash 3.2 with -ex.
          log_exit() { printf '%s checks exit=%s\n' "$(date -u +%FT%TZ)" "$1"; }
          trap 'log_exit "$?"' EXIT
          npm ci
          # Infrastructure gates measure writer DOM with the lockfile-pinned Playwright browser.
          npx playwright install --with-deps chromium
          npm run migrate -w @mycel/db
          npm run verify:checks

      - name: Keep downloaded packages for the cache
        if: steps.browser-debs.outputs.cache-hit != 'true'
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/browser-debs {} +

      - name: Upload check evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-evidence
          path: .scratch/ci/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # Matrix cells run on separate runners: no shared database, seed, blobs or processes.
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [no-js, a11y]
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: mycel
          POSTGRES_USER: mycel
          POSTGRES_PASSWORD: mycel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mycel -d mycel" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mycel:mycel@localhost:5432/mycel
      APP_DATABASE_URL: postgres://mycel_app:mycel_app_ci@localhost:5432/mycel
      MYCEL_APP_PASSWORD: mycel_app_ci
      AUTH_DATABASE_URL: postgres://mycel_authenticator:mycel_auth_ci@localhost:5432/mycel
      MYCEL_AUTH_PASSWORD: mycel_auth_ci
      SIGNING_SECRET: ci-only-signing-secret
      AUDIT_HASH_KEY: ci-only-audit-hash-key
      CONNECTION_CREDENTIAL_KEY: '1010101010101010101010101010101010101010101010101010101010101010'
      PUBLIC_BASE_URL: http://127.0.0.1:4173
      PLATFORM_DOMAIN: localhost
      MAIL_FROM: CI <noreply@example.org>
      MAILER: console
      # The browser flows need the same deterministic model in web, API and worker.
      ASSIST_PROVIDER: fake
      # In CI a missing database or browser fails the e2e gate instead of skipping it.
      E2E_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same packages and reasons as in `checks`.
      - name: Restore browser system packages
        id: browser-debs
        timeout-minutes: 2
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ~/browser-debs
          key: browser-debs-ubuntu-24.04-v1

      - name: Hand restored packages to apt
        run: |
          mkdir -p ~/browser-debs
          find ~/browser-debs -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +

      - name: Build and run browser project
        timeout-minutes: 12
        run: |
          mkdir -p .scratch/ci
          exec > >(tee .scratch/ci/browser-${{ matrix.project }}.log) 2>&1
          PS4='+ $(date -u +%FT%TZ) '
          set -x
          # Capture the status before timestamp expansion, including on Bash 3.2 with -ex.
          log_exit() { printf '%s browser exit=%s\n' "$(date -u +%FT%TZ)" "$1"; }
          trap 'log_exit "$?"' EXIT
          npm ci
          npx playwright install --with-deps chromium
          npm run migrate -w @mycel/db
          npm run build
          # List emits each completed test and duration immediately, even if a later test hangs.
          npm run test:e2e -- --project=${{ matrix.project }} --reporter=list

      - name: Keep downloaded packages for the cache
        if: steps.browser-debs.outputs.cache-hit != 'true'
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/browser-debs {} +

      - name: Upload browser evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ matrix.project }}
          path: |
            .scratch/ci/
            apps/web/test-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # Preserve the protected context. Missing, skipped or cancelled work cannot turn it green.
  verify:
    if: always()
    needs: [checks, browsers, security, image, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every dependency to succeed
        run: |
          test '${{ needs.checks.result }}' = success
          test '${{ needs.browsers.result }}' = success
          test '${{ needs.security.result }}' = success
          test '${{ needs.image.result }}' = success
          test '${{ needs.compose.result }}' = success

  # Known advisories in the whole dependency tree and secrets in the whole history (TODO #20c
  # decision 8). A red `npm audit` without a fix is a stop to discuss, never an --omit or an
  # exception list. Gitleaks as a pinned container, not gitleaks-action, which needs a licence for
  # organisation repositories; .gitleaks.toml excepts only the CI placeholders.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

      - name: gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

      - name: Secretscan allow-list regression
        run: node --test scripts/gates/gitleaks.test.mjs

  # The deployable artefact (Dockerfile): build it without pushing, then start each entrypoint
  # and wait for its HEALTHCHECK. A separate job so an image problem shows up as its own red
  # check next to `verify`. Publishing to a registry is release.yml's job, on a tag.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image (no push)
        run: docker build -t mycel:ci .

      - name: Each entrypoint becomes healthy
        run: |
          # Dummy configuration: /healthz touches no adapter and the pools connect lazily, so no
          # database is needed to prove the processes start. MAILER=console is refused in
          # production, hence the placeholder TEM settings; likewise the fs blob store, hence the
          # placeholder bucket (the S3 client connects on first use, not at start).
          # Only the worker gets the owner's DATABASE_URL (ADR 011 rule 1, TODO #20b): api runs
          # with MYCEL_WORKER=off and web without it, as in production.
          env_args="-e APP_DATABASE_URL=postgres://mycel_app:x@127.0.0.1:1/mycel
            -e AUTH_DATABASE_URL=postgres://mycel_authenticator:x@127.0.0.1:1/mycel
            -e SIGNING_SECRET=ci-only-signing-secret -e AUDIT_HASH_KEY=ci-only-audit-hash-key
            -e CONNECTION_CREDENTIAL_KEY=1010101010101010101010101010101010101010101010101010101010101010
            -e PUBLIC_BASE_URL=http://localhost:3000
            -e PLATFORM_DOMAIN=example.org -e MYCEL_TRUST_PROXY=1
            -e MAIL_FROM=noreply@example.org -e MAILER=tem -e TEM_SECRET_KEY=x -e TEM_PROJECT_ID=x
            -e BLOB_STORE=s3 -e BLOB_S3_BUCKET=x -e BLOB_S3_ACCESS_KEY_ID=x -e BLOB_S3_SECRET_ACCESS_KEY=x"
          for role in api web worker; do
            case "$role" in
              api) role_args="-e MYCEL_WORKER=off" ;;
              worker) role_args="-e DATABASE_URL=postgres://mycel:x@127.0.0.1:1/mycel" ;;
              *) role_args="" ;;
            esac
            docker run -d --name "mycel-$role" --health-interval 2s --health-start-period 2s \
              $env_args $role_args mycel:ci "$role"
          done
          for role in api web; do
            if docker exec "mycel-$role" printenv DATABASE_URL >/dev/null; then
              echo "$role has DATABASE_URL"; exit 1
            fi
          done
          for role in api web worker; do
            status=starting
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "mycel-$role")
              [ "$status" = healthy ] && break
              sleep 2
            done
            echo "$role: $status"
            if [ "$status" != healthy ]; then docker logs "mycel-$role"; exit 1; fi
          done

  # The production stack (compose.yml) on an empty runner, TODO #18a: Postgres with a
  # non-superuser owner, migrate, api, web, worker and Caddy with on-demand TLS from its own CA
  # (compose.ci.yml). scripts/compose-proof.sh runs `mycel setup` and checks from outside through
  # Caddy that /internal/*, /readyz, /metrics and /platform/* are closed, from inside that the
  # certificate ask answers, that api and web hold no DATABASE_URL and the worker is ready. It
  # prints the stack's logs on any failure. A developer runs the same script before pushing.
  compose:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image (no push)
        run: docker build -t mycel:ci .

      - name: Compose proof
        run: scripts/compose-proof.sh
