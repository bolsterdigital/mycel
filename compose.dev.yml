# Development Postgres (ADR 002, ADR 008). Only the database runs in a container; the apps run on
# the host with `npm run dev`. Rejected: a full compose stack, which hides the composition the
# probe is meant to make visible. The `mycel` user owns the schema and runs migrations; the app
# connects as `mycel_app`, whose password `npm run migrate -w @mycel/db` sets from
# MYCEL_APP_PASSWORD.
#
# The host port comes from MYCEL_PG_PORT (compose reads .env for interpolation), so a machine whose
# 5432 is taken can move it without an override file; it binds to 127.0.0.1 because a bare
# `<port>:5432` is reachable from outside on a server without a Docker `ip` default.
# Rejected: a per-machine compose.override.yml, which every new machine has to rediscover.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycel
      POSTGRES_USER: mycel
      POSTGRES_PASSWORD: mycel
    ports:
      - '127.0.0.1:${MYCEL_PG_PORT:-5432}:5432'
    volumes:
      - mycel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mycel -d mycel']
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible storage for the BlobStore contract suite (TODO #10). Opt-in, because the
  # default store is a directory (`BLOB_STORE=fs`): `docker compose -f compose.dev.yml --profile
  # blob up -d`, then set the BLOB_S3_* variables from .env.example. Bound to 127.0.0.1 like
  # Postgres; the port comes from MYCEL_S3_PORT for the same reason as MYCEL_PG_PORT. RustFS
  # (Apache-2.0) and not MinIO: MinIO no longer publishes container images, and RustFS starts
  # from environment variables alone, which a GitHub Actions service container needs.
  s3:
    profiles: ['blob']
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: mycel
      RUSTFS_SECRET_KEY: mycel-s3-dev
    ports:
      - '127.0.0.1:${MYCEL_S3_PORT:-9000}:9000'
    volumes:
      - mycel-s3:/data

volumes:
  mycel-pg:
  mycel-s3:
