<div class="block form form-card width-wide">
  <form method="post" class="signup">
    <input
      type="hidden"
      name="formId"
      value="01900000-0000-7000-8000-00000000f001"
    />
    <input type="hidden" name="locale" value="en" />
    <input type="hidden" name="_started" value="started-token" />
    <div class="hp" aria-hidden="true">
      <label for="f-01900000-0000-7000-8000-00000000f001-website"
        >Leave this field empty</label
      >
      <input
        id="f-01900000-0000-7000-8000-00000000f001-website"
        name="website"
        type="text"
        tabindex="-1"
        autocomplete="off"
      />
    </div>
    <div class="field">
      <label for="f-01900000-0000-7000-8000-00000000f001-email"
        >E-mail address</label
      >
      <input
        id="f-01900000-0000-7000-8000-00000000f001-email"
        name="email"
        type="email"
        autocomplete="email"
        required=""
        value=""
      />
    </div>
    <div class="field check">
      <input
        id="f-01900000-0000-7000-8000-00000000f001-consent"
        name="consent"
        type="checkbox"
        required=""
      />
      <label for="f-01900000-0000-7000-8000-00000000f001-consent"
        >Yes, send me the newsletter. I can unsubscribe at any time.</label
      >
    </div>
    <button type="submit">Sign up</button>
  </form>
</div>
