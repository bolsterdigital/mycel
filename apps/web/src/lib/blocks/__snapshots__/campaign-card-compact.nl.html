<section
  id="block-campaign-card-compact"
  class="block campaign-card campaign-card-compact width-content"
  aria-labelledby="campaign-campaign-card-compact-title"
>
  <div class="campaign-card-inner">
    <div class="campaign-card-image">
      <picture
        ><source
          type="image/avif"
          srcset="
            /media/01900000-0000-7000-8000-00000000d001/w320.avif 320w,
            /media/01900000-0000-7000-8000-00000000d001/w640.avif 640w,
            /media/01900000-0000-7000-8000-00000000d001/w960.avif 960w
          "
          sizes="(min-width: 48rem) 16rem, 100vw" />
        <img
          src="/media/01900000-0000-7000-8000-00000000d001/w960.webp"
          srcset="
            /media/01900000-0000-7000-8000-00000000d001/w320.webp 320w,
            /media/01900000-0000-7000-8000-00000000d001/w640.webp 640w,
            /media/01900000-0000-7000-8000-00000000d001/w960.webp 960w
          "
          sizes="(min-width: 48rem) 16rem, 100vw"
          alt=""
          width="1600"
          height="900"
          loading="lazy"
          decoding="async"
          class="fx-3 fy-7"
      /></picture>
    </div>
    <div class="campaign-card-text">
      <p class="campaign-kind">Petitie</p>
      <h2 id="campaign-campaign-card-compact-title"><a href="/red-het-park">Red het park</a></h2>
      <p class="lead">Teken voor het park.</p>
      <div class="campaign-action">
        <div class="campaign-count">
          <p class="campaign-count-figure" id="campaign-campaign-card-compact-count">
            <strong>1.234</strong> <span>Handtekeningen</span>
          </p>
          <progress
            max="5000"
            value="1234"
            aria-labelledby="campaign-campaign-card-compact-count campaign-campaign-card-compact-goal"
          >
            1.234
          </progress>
          <p class="campaign-count-goal" id="campaign-campaign-card-compact-goal">Doel: 5.000</p>
        </div>
      </div>
      <div class="actions"><a class="button" href="/red-het-park">Teken de petitie</a></div>
    </div>
  </div>
</section>
