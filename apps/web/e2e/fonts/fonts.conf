<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The only fonts Chromium sees in an e2e run on Linux (playwright.config.ts): the
     fonts the CI runner resolves `system-ui`, `sans-serif` and `monospace` to, with Ubuntu's
     default rendering (slight hinting, greyscale), so text measures to the fraction of a pixel
     what it measures in CI. Rejected: including the system configuration, which differs per
     machine and is what made local and CI disagree. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">mycel-e2e-fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
